# Builds the HOLLOW Coffee iOS app on a macOS runner and uploads it to
# TestFlight. Run it from the Actions tab ("Run workflow").
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, IOS_SIGNING (from "iOS setup").
name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # The Worker the app calls (leave unset to use the default in src/client/lib/native.ts).
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the web app and copy it into the iOS project
        run: |
          pnpm build
          npx cap sync ios

      - name: Install the signing certificate and profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_SIGNING: ${{ secrets.IOS_SIGNING }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_SIGNING:-}" ]; then echo "::error::IOS_SIGNING secret missing: run the 'iOS setup (one time)' workflow first"; exit 1; fi
          SIGN_DIR="$RUNNER_TEMP/sign"; mkdir -p "$SIGN_DIR"
          printf '%s\n' "$IOS_SIGNING" > "$SIGN_DIR/signing.pem"
          P12_PASSWORD="$(openssl rand -hex 16)"
          openssl pkcs12 -export -in "$SIGN_DIR/signing.pem" -inkey "$SIGN_DIR/signing.pem" \
            -out "$SIGN_DIR/dist.p12" -passout "pass:$P12_PASSWORD" \
            -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"; KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$SIGN_DIR/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$SIGN_DIR/signing.pem" "$SIGN_DIR/dist.p12"

          node scripts/ios-signing.mjs profile "$SIGN_DIR/app.mobileprovision"
          UUID="$(security cms -D -i "$SIGN_DIR/app.mobileprovision" | plutil -extract UUID raw -)"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"; cp "$SIGN_DIR/app.mobileprovision" "$dir/$UUID.mobileprovision"
          done

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || true
          grep -E 'error:|\*\* ARCHIVE' "$RUNNER_TEMP/xcodebuild.log" || true
          test -d "$RUNNER_TEMP/App.xcarchive" || { tail -200 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"; else printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH"; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>N2KXQ7MVY3</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>com.hollowzulfi.coffee</key><string>HOLLOW Coffee App Store</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm -f "$KEY_PATH"
          echo "### Uploaded build $BUILD_NUMBER to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "Apple processes it for 5–15 minutes, then it appears in App Store Connect → TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
