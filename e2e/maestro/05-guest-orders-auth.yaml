appId: com.hollowzulfi.coffee
name: Guest order history requires sign-in - no session created
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: "لا تفوّت كوبك وأنت قريب"
    timeout: 15000
- tapOn: "مو الحين"
- assertNotVisible: "لا تفوّت كوبك وأنت قريب"
- assertVisible:
    text: "QA Espresso|إسبريسو تجريبي"
- tapOn:
    text: "^(My orders|طلباتي)$"
- assertVisible:
    text: "Welcome back|أهلًا من جديد"
- assertVisible:
    text: "^(Password|كلمة المرور)$"
- tapOn:
    text: "Browse the menu without signing in|تصفّح المنيو بدون تسجيل"
- assertVisible:
    text: "QA Espresso|إسبريسو تجريبي"
