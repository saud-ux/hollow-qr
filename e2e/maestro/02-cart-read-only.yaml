appId: com.hollowzulfi.coffee
name: Guest cart - add item without placing order
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: "لا تفوّت كوبك وأنت قريب"
    timeout: 15000
- tapOn: "مو الحين"
- assertNotVisible: "لا تفوّت كوبك وأنت قريب"
- assertVisible:
    text: "QA Espresso|إسبريسو تجريبي"
- tapOn:
    text: "Add QA Espresso to cart|إضافة إسبريسو تجريبي إلى السلة"
- tapOn:
    text: "^(Cart|السلة)$"
- assertVisible:
    text: "Your cart|سلتك"
- assertVisible:
    text: "QA Espresso|إسبريسو تجريبي"
