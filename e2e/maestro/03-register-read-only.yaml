appId: com.hollowzulfi.coffee
name: Guest registration screen - no account created
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: "لا تفوّت كوبك وأنت قريب"
    timeout: 15000
- tapOn: "مو الحين"
- assertNotVisible: "لا تفوّت كوبك وأنت قريب"
- assertVisible:
    text: "QA Espresso|إسبريسو تجريبي"
- tapOn:
    text: "^(Account|حسابي)$"
- tapOn:
    text: "^(Sign up|إنشاء حساب)$"
- assertVisible:
    text: ".*(Sign up, collect|سجّل واجمع).*"
- assertVisible:
    text: "Confirm password|تأكيد كلمة المرور"
